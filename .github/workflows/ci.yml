name: CI

# Two checks, both cheap, on every push and pull request.
#
# There was nothing here before, which is a gap worth naming: this repo takes
# card payments and works out what a contractor owes the office, and until now
# the only thing standing between a typo in that arithmetic and production was
# somebody noticing. `next build` type-checks the app, and `node --test` runs
# the fee engine's own suite - no test framework, no new dependencies.

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run pointless. Cancel it
# rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 is what the tests need: node --test strips TypeScript types
          # natively from this version, which is how the suite runs against
          # fees.ts with nothing installed to compile it.
          node-version: "22"
          cache: npm

      # ci, not install: builds from the lockfile exactly, and fails rather
      # than quietly resolving something new.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test the fee engine
        run: npm test
